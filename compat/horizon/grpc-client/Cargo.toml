[package]
name = "horizon-grpc-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# This modern transport client is independent of liquid-rust's workspace/MSRV.
[workspace]

[dependencies]
prost = "0.14"
serde_json = "1.0"
sha2 = "0.10.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
